services:
  - type: web
    name: zamp-new
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --worker-class gthread --threads 8 --timeout 180 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: APP_SECRET
        generateValue: true
      - key: DEMO_USERNAME
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      # Optional Gemini/OpenAI-compatible extraction configuration. Supply
      # these in Render; the API key never reaches the browser or repository.
      - key: AI_REVIEW_API_URL
        sync: false
      - key: AI_REVIEW_MODEL
        sync: false
      - key: AI_REVIEW_API_KEY
        sync: false
      - key: AI_REQUEST_TIMEOUT
        value: "12"
