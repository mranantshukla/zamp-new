services:
  - type: web
    name: zampai-invoice-intelligence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --worker-class gthread --threads 8 --timeout 180 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: zampai-postgres
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: DEMO_USERNAME
        sync: false
      - key: DEMO_PASSWORD
        sync: false
databases:
  - name: zampai-postgres
    plan: free
    databaseName: zampai
    user: zampai
